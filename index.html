    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #00d2ff;
            --bg: #0f141e;
            --card-bg: #1a2233;
            --text: #ffffff;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 8px 0;
            text-align: center;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            margin-bottom: 20px;
        }

        header h1 { font-size: 1.2rem; }

        .container {
            width: 98%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(5, 1fr); 
            gap: 8px;
            padding: 5px;
        }

        @media (max-width: 480px) {
            .container { grid-template-columns: repeat(3, 1fr); }
        }

        .show-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            height: 190px; 
            transition: 0.3s;
        }

        .show-card:hover { transform: translateY(-5px); border-color: var(--primary); }

        .image-box {
            width: 100%;
            height: 110px; 
            background: #000;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info {
            padding: 6px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .info h2 { 
            font-size: 0.75rem; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }

        .btn {
            background: var(--primary);
            color: #000;
            padding: 3px 0;
            border-radius: 5px;
            font-size: 0.65rem;
            font-weight: bold;
            width: 100%;
            display: block;
        }

        footer { margin: 30px 0 15px; font-size: 0.7rem; opacity: 0.4; }
    </style>
</head>
